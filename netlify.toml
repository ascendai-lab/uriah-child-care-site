[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These are public by design (they ship in the page code), so the secret scan should skip them.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET,SITE_URL,SANITY_STUDIO_URL"

# ─── Security Headers ───────────────────────────────────────────────────────
# IMPORTANT: The Content-Security-Policy frame-ancestors directive is what
# allows Sanity Studio (embedded at /studio or hosted on *.sanity.studio) to
# show this site in its Presentation iframe for visual editing.
# Do NOT add X-Frame-Options: DENY — it overrides this and breaks visual editing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.studio https://sanity.studio"

# Astro's Netlify adapter routes /api/* and every page to its SSR function
# automatically. No manual redirects needed.

# ─── 301s for pages renamed on the new site (Nov 2026) ─────────────────────
# Uriah is not a preschool and is closed on Sunday (Tameca, 2026-11-05).
[[redirects]]
  from = "/preschool-vineland-nj"
  to = "/early-learning-vineland-nj/"
  status = 301
  force = true

[[redirects]]
