<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Netlify Forms reads this file at deploy time to learn the form's fields. The site's pages are rendered
      on the server, so Netlify can't see the real form there. The React TourForm posts to this path with
      form-name=tour-request. Keep these fields in step with toNetlifyFields() in src/lib/tour.ts.
    -->
    <form name="tour-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="child_age" />
      <input name="care_needed" />
      <input name="tour_times" />
      <input name="subsidy" />
      <textarea name="message"></textarea>
      <input name="page" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="ga_client_id" />
    </form>

    <!-- Careers page job application (src/components/ui/JobApplicationForm.tsx). Keep in step with toNetlifyFormData() in src/lib/careers.ts. -->
    <form name="job-application" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="city" />
      <input name="position" />
      <input name="hours" />
      <input name="availability" />
      <input name="start_date" />
      <textarea name="experience"></textarea>
      <input name="credentials" />
      <input name="over_18" />
      <input name="background_check" />
      <textarea name="message"></textarea>
      <input type="file" name="resume" />
      <input type="file" name="cover_letter" />
    </form>
  </body>
</html>
